<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سعيد يا أسماء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Cairo', sans-serif;
            position: relative;
            color: white;
        }

        /* خلفية نجوم */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, white, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, white, transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 160px 120px, white, transparent);
            background-size: 200px 200px;
            animation: twinkle 8s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.9; }
        }

        /* الطائرة واللافتة */
        .plane-wrapper {
            position: absolute;
            top: 38%;
            left: -500px;
            display: flex;
            align-items: center;
            gap: 0;
            animation: flyModern 11s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            z-index: 20;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.4));
        }

        @keyframes flyModern {
            0% {
                left: -500px;
                top: 42%;
                transform: scale(0.9);
            }
            50% {
                top: 32%;
                transform: scale(1);
            }
            100% {
                left: 115%;
                top: 28%;
                transform: scale(0.95);
            }
        }

        /* طائرة SVG عصرية */
        .plane {
            width: 90px;
            height: 50px;
            position: relative;
            z-index: 3;
        }

        .plane svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 12px rgba(100, 200, 255, 0.6));
        }

        /* الحبل المتوهج */
        .rope {
            width: 55px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #a0e9ff, #ffffff);
            margin-right: -8px;
            position: relative;
            box-shadow: 0 0 8px rgba(160, 233, 255, 0.8);
        }

        /* اللافتة العصرية */
        .banner {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            padding: 14px 32px;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            letter-spacing: 0.5px;
        }

        .banner::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 50%;
            transform: translateY(-50%);
            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            border-right: 14px solid rgba(255, 255, 255, 0.15);
        }

        .banner span {
            background: linear-gradient(90deg, #ff9a9e, #fad0c4, #fad0c4, #a18cd1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 700;
        }

        /* نص سفلي أنيق */
        .bottom-text {
            position: absolute;
            bottom: 50px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .bottom-text h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fff, #a0e9ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 30px rgba(160, 233, 255, 0.3);
        }

        .bottom-text p {
            font-size: 16px;
            opacity: 0.75;
            letter-spacing: 1px;
        }

        /* جزيئات متوهجة */
        .particle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #a0e9ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #a0e9ff;
            animation: rise 7s linear infinite;
            opacity: 0;
        }

        @keyframes rise {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            15% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }

        /* توهج خفيف في الوسط */
        .glow {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 200px;
            background: radial-gradient(circle, rgba(100, 180, 255, 0.15) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div class="stars"></div>
    <div class="glow"></div>

    <!-- جزيئات -->
    <div class="particle" style="left: 12%; animation-delay: 0s;"></div>
    <div class="particle" style="left: 28%; animation-delay: 1.8s; width: 4px; height: 4px;"></div>
    <div class="particle" style="left: 45%; animation-delay: 3.2s;"></div>
    <div class="particle" style="left: 62%; animation-delay: 0.7s; width: 5px; height: 5px;"></div>
    <div class="particle" style="left: 78%; animation-delay: 2.5s;"></div>
    <div class="particle" style="left: 90%; animation-delay: 4.1s; width: 3px; height: 3px;"></div>

    <!-- الطائرة -->
    <div class="plane-wrapper">
        <div class="plane">
            <svg viewBox="0 0 100 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- جسم الطائرة -->
                <path d="M5 25 L70 22 L85 25 L70 28 Z" fill="#e8f4ff"/>
                <!-- الجناح العلوي -->
                <path d="M35 25 L50 8 L58 10 L45 25 Z" fill="#b8d4f0"/>
                <!-- الجناح السفلي -->
                <path d="M35 25 L50 42 L58 40 L45 25 Z" fill="#b8d4f0"/>
                <!-- الذيل -->
                <path d="M5 25 L12 15 L18 17 L12 25 Z" fill="#90c0e8"/>
                <path d="M5 25 L12 35 L18 33 L12 25 Z" fill="#90c0e8"/>
                <!-- النافذة -->
                <circle cx="62" cy="25" r="4" fill="#4fc3f7"/>
                <!-- ضوء أمامي -->
                <circle cx="82" cy="25" r="3" fill="#fff" opacity="0.9"/>
            </svg>
        </div>
        <div class="rope"></div>
        <div class="banner">
            <span>عيد ميلاد سعيد يا أسماء</span> ✨
        </div>
    </div>

    <div class="bottom-text">
        <h1>كل سنة وأنتِ أجمل</h1>
        <p>أسماء · يوم ميلادك مميز</p>
    </div>

</body>
</html>
